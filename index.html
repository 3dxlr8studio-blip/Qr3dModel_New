<html lang="en">

<head>

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
  >

  <title>XLR8 WebXR AR</title>

  <link
    rel="stylesheet"
    href="./style.css"
  >

  <script type="importmap">
  {
    "imports": {
      "three":
        "https://unpkg.com/three@0.160.0/build/three.module.js",

      "three/addons/":

</html>
